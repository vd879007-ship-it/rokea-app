name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Sync Capacitor Android
        run: npx cap sync android

      - name: 7. Build Debug APK & Release AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: 8. Prepare Direct APK & AAB Files
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Rokea-by-RK.apk
          cp android/app/build/outputs/bundle/release/app-release.aab ./Rokea-by-RK.aab

      - name: 9. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rokea-by-RK-Debug-APK
          path: ./Rokea-by-RK.apk
          retention-days: 30

      - name: 10. Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rokea-by-RK-Release-AAB
          path: ./Rokea-by-RK.aab
          retention-days: 30

      - name: 11. Publish Direct Mobile Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Rokea by RK Mobile App v1.0.0"
          body: "Official Android App for Rokea by RK. Tap Rokea-by-RK.apk to download directly on mobile."
          files: |
            ./Rokea-by-RK.apk
            ./Rokea-by-RK.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
