name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Build Web Bundle
        run: npm run build

      - name: 6. Sync Capacitor Android
        run: npx cap sync android

      - name: 7. Build Debug APK & Release AAB
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: 8. Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Rokea-by-RK-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 9. Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Rokea-by-RK-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
