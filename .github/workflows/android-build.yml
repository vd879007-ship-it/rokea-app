name: Build Android APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: 5. Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: 6. Build Web Assets
        run: npm run build

      - name: 7. Sync Capacitor Android
        run: npx cap sync android

      - name: 8. Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: 9. Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 10. Build Release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 11. Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Rokea-by-RK-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: 12. Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Rokea-by-RK-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
